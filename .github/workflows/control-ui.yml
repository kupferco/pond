name: Control UI hosting

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: ['control-ui/**', 'docs/**', '.github/workflows/control-ui.yml']
  push:
    branches: [main]
    paths: ['control-ui/**', 'docs/**', '.github/workflows/control-ui.yml']

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    # Fork PRs get no secrets, so skip them.
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-ui/package-lock.json
      - run: npm ci
      - run: npm run build:site
      - run: npm test
      - name: Check deploy credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POND_CONTROL }}
        run: |
          if [ -n "$SA" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_POND_CONTROL is not set, so the Firebase deploy is skipped. See 'Fix on the computer' in docs/notes/2026-11-10-control-ui-spike.md."
          fi
      - name: Preview channel (pull requests)
        id: preview
        if: github.event_name == 'pull_request' && steps.creds.outputs.available == 'true'
        # The preview is nice to have. If the channel quota is reached (HTTP 429), warn instead of failing the PR.
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POND_CONTROL }}
          projectId: pond-grow
          entryPoint: control-ui
          # Safety net: channels delete themselves if the cleanup job below ever misses one.
          expires: 7d
      - name: Warn if the preview failed
        if: github.event_name == 'pull_request' && steps.preview.outcome == 'failure'
        run: echo "::warning::The Firebase preview channel could not be deployed (often the channel quota, HTTP 429). The build and tests passed; delete old channels in the Firebase console."
      - name: Tell Viber the preview is ready
        if: github.event_name == 'pull_request' && steps.preview.outcome == 'success'
        env:
          VIBER_URL: ${{ secrets.VIBER_URL }}
          VIBER_HOOK_SECRET: ${{ secrets.VIBER_HOOK_SECRET }}
          URL: ${{ steps.preview.outputs.details_url }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$VIBER_URL" ] || [ -z "$VIBER_HOOK_SECRET" ]; then
            echo "::warning::VIBER_URL or VIBER_HOOK_SECRET is not set, so Viber was not told about the preview."
            exit 0
          fi
          jq -n --arg repo "${{ github.repository }}" --arg branch "$BRANCH" --arg url "$URL" '{repo:$repo, branch:$branch, url:$url}' \
            | curl -fsS --connect-timeout 5 -m 20 -X POST "$VIBER_URL/hooks/preview" \
                -H "Authorization: Bearer $VIBER_HOOK_SECRET" \
                -H "Content-Type: application/json" --data-binary @- \
            || echo "::warning::Could not tell Viber the preview is ready."
      - name: Live (merge to main)
        if: github.event_name == 'push' && steps.creds.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POND_CONTROL }}
          projectId: pond-grow
          channelId: live
          entryPoint: control-ui
      - name: Firestore and Storage rules (merge to main)
        # Rules are only deployed from main, never from a pull request. Needs Firestore and Storage enabled in the
        # Firebase console and the service account to hold Firebase Rules Admin; see the Viber #74 pull request.
        if: github.event_name == 'push' && steps.creds.outputs.available == 'true'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POND_CONTROL }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx --yes firebase-tools@latest deploy --only firestore:rules,storage --project pond-grow --non-interactive \
            || echo "::warning::Could not deploy Firestore/Storage rules. Is Firestore and Storage enabled in the console, and does the service account have Firebase Rules Admin?"

  cleanup-preview:
    # Delete this PR's preview channel when the PR is closed, merged or not.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview channel
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POND_CONTROL }}
          CHANNEL: pr${{ github.event.pull_request.number }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_POND_CONTROL is not set, so the preview channel was not deleted."
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"
          if out=$(GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
              npx --yes firebase-tools@latest hosting:channel:delete "$CHANNEL" --project pond-grow --force --non-interactive 2>&1); then
            echo "$out"
          elif echo "$out" | grep -qiE 'not found|404'; then
            echo "Channel $CHANNEL does not exist, nothing to delete."
          else
            echo "$out"
            echo "::warning::Could not delete preview channel $CHANNEL. It will expire on its own."
          fi
