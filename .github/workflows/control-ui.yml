name: Control UI hosting

on:
  pull_request:
    paths: ['control-ui/**', 'docs/**', '.github/workflows/control-ui.yml']
  push:
    branches: [main]
    paths: ['control-ui/**', 'docs/**', '.github/workflows/control-ui.yml']

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    # Fork PRs get no secrets, so skip them.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-ui/package-lock.json
      - run: npm ci
      - run: npm run build:site
      - run: npm test
      - name: Check deploy credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POND_CONTROL }}
        run: |
          if [ -n "$SA" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_POND_CONTROL is not set, so the Firebase deploy is skipped. See 'Fix on the computer' in docs/notes/2026-11-10-control-ui-spike.md."
          fi
      - name: Preview channel (pull requests)
        id: preview
        if: github.event_name == 'pull_request' && steps.creds.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POND_CONTROL }}
          projectId: pond-grow
          entryPoint: control-ui
      - name: Tell Viber the preview is ready
        if: github.event_name == 'pull_request' && steps.preview.outcome == 'success'
        env:
          VIBER_URL: ${{ secrets.VIBER_URL }}
          VIBER_HOOK_SECRET: ${{ secrets.VIBER_HOOK_SECRET }}
          URL: ${{ steps.preview.outputs.details_url }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$VIBER_URL" ] || [ -z "$VIBER_HOOK_SECRET" ]; then
            echo "::warning::VIBER_URL or VIBER_HOOK_SECRET is not set, so Viber was not told about the preview."
            exit 0
          fi
          jq -n --arg repo "${{ github.repository }}" --arg branch "$BRANCH" --arg url "$URL" '{repo:$repo, branch:$branch, url:$url}' \
            | curl -fsS --connect-timeout 5 -m 20 -X POST "$VIBER_URL/hooks/preview" \
                -H "Authorization: Bearer $VIBER_HOOK_SECRET" \
                -H "Content-Type: application/json" --data-binary @- \
            || echo "::warning::Could not tell Viber the preview is ready."
      - name: Live (merge to main)
        if: github.event_name == 'push' && steps.creds.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POND_CONTROL }}
          projectId: pond-grow
          channelId: live
          entryPoint: control-ui
