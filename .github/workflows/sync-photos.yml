name: Sync photos

# Run from the Actions tab ("Run workflow"): copies new or changed images from the Drive folder
# (POND_PHOTOS_FOLDER_ID) into Cloud Storage. Only people with write access to the repo can start it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-ui/package-lock.json
      - run: npm ci
      - name: Sync
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POND_CONTROL }}
          POND_PHOTOS_FOLDER_ID: ${{ secrets.POND_PHOTOS_FOLDER_ID || vars.POND_PHOTOS_FOLDER_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node scripts/sync-photos.mjs
