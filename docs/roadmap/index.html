<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — Roadmap</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .cols{display:grid;gap:8px}
  .cols .card{margin-bottom:12px}
  .cols .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .cols .foot .chip{margin:0}
  .cols .go{margin:0}
  @media (min-width:900px){.cols{grid-template-columns:repeat(3,1fr);gap:24px}}
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="roadmap"></script>
<header class="page-head">
  <div class="inner wide">
    <p class="label">Plan</p>
    <h1>Roadmap</h1>
    <p class="updated" id="updated"></p>
  </div>
</header>
<section class="block">
  <div class="inner wide cols" id="cols"></div>
</section>
<footer class="site">Designed in London, being built in São Paulo.</footer>
<script>
function slug(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
fetch('roadmap.json').then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent='Last updated '+d.updated;
  const cols=document.getElementById('cols');
  [['now','Now','Working on now'],['next','Next','Coming up'],['later','Later','Later on']].forEach(([k,label,title])=>{
    const c=document.createElement('div');
    const l=document.createElement('p');l.className='label';l.textContent=label;
    const h=document.createElement('h2');h.textContent=title;
    c.append(l,h);
    (d[k]||[]).forEach(i=>{
      const card=document.createElement('a');card.className='card';card.href='item.html?id='+slug(i.title);
      card.innerHTML='<h3></h3><p></p><div class="foot"><span class="chip"></span><span class="go">Details →</span></div>';
      card.querySelector('h3').textContent=i.title;
      card.querySelector('p').textContent=i.note||'';
      const ch=card.querySelector('.chip');if(i.area)ch.textContent=i.area;else ch.remove();
      c.appendChild(card);
    });
    cols.appendChild(c);
  });
});
</script>
</body>
</html>
