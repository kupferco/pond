<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — Roadmap item</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="preload" as="fetch" href="roadmap.json" crossorigin>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="roadmap"></script>
<header class="page-head">
  <div class="inner">
    <a class="back" href="./">← Roadmap</a>
    <div id="tags"></div>
    <h1 id="title">Loading…</h1>
    <p class="lead" id="summary"></p>
  </div>
</header>
<div id="body"></div>
<footer class="site">Designed in London, being built in São Paulo.</footer>
<script>
function slug(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
const id=new URLSearchParams(location.search).get('id');
fetch('roadmap.json').then(r=>r.json()).then(d=>{
  let item=null,stage=null;
  ['now','next','later'].forEach(k=>(d[k]||[]).forEach(i=>{if(slug(i.title)===id){item=i;stage=k;}}));
  if(!item){document.getElementById('title').textContent='Could not find that roadmap item.';return;}
  document.title='Pond — '+item.title;
  const tags=document.getElementById('tags');
  const s=document.createElement('span');s.className='chip '+stage;s.textContent=stage;tags.appendChild(s);
  if(item.area){const a=document.createElement('span');a.className='chip';a.textContent=item.area;tags.appendChild(a);}
  document.getElementById('title').textContent=item.title;
  document.getElementById('summary').textContent=item.note||'';
  const body=document.getElementById('body');
  if(item.details){
    const sec=document.createElement('section');sec.className='block';
    sec.innerHTML='<div class="inner"><p class="label">Details</p><div class="card"><p></p></div></div>';
    sec.querySelector('p:not(.label)').textContent=item.details;
    body.appendChild(sec);
  }
  if(item.links&&item.links.length){
    const sec=document.createElement('section');sec.className='block';
    sec.innerHTML='<div class="inner"><p class="label">Related</p><div class="rows"></div></div>';
    const rows=sec.querySelector('.rows');
    item.links.forEach(x=>{const a=document.createElement('a');a.className='row';a.href=x.href;const dv=document.createElement('div');dv.textContent=x.label;a.appendChild(dv);rows.appendChild(a);});
    body.appendChild(sec);
  }
});
</script>
</body>
</html>
