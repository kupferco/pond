<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — Part list</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-bottom:10px}
  .sechead h2{margin:0}
  .total{font-weight:700;color:var(--ink);font-size:15px}
  .total small{font-weight:400;color:var(--muted)}
  .note{font-size:14px;color:var(--body);margin:0 0 10px}
  .tbl{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden;box-shadow:var(--shadow-sm)}
  :root{--cols:20px minmax(0,1fr) auto}
  .cols,.line{display:grid;grid-template-columns:var(--cols);gap:0 10px;align-items:center;padding:0 12px;min-height:44px}
  .cols{display:none;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--bg-soft);border-bottom:1px solid var(--line);min-height:34px}
  details.row{border-bottom:1px solid var(--line)}
  details.row>summary{list-style:none;cursor:pointer;display:block}
  details.row>summary::-webkit-details-marker{display:none}
  .chev{width:20px;color:var(--muted);transition:transform .15s;text-align:center}
  details[open]>summary .chev{transform:rotate(90deg)}
  .nm{font-weight:700;color:var(--ink);font-size:14px;line-height:1.25;padding:4px 0;overflow-wrap:anywhere}
  .tot{font-weight:700;color:var(--ink);white-space:nowrap;text-align:right;font-size:14px}
  .tot.tbc,.cell.tbc{font-weight:400;color:var(--muted)}
  .cell{display:none;text-align:right;white-space:nowrap;font-size:14px}
  .cell.l{text-align:left}
  details.row.done .nm{text-decoration:line-through;opacity:.6}
  .det{padding:4px 14px 14px 42px;font-size:14px;color:var(--body)}
  .det p{margin:0 0 8px;overflow-wrap:anywhere}
  .det .k{font-weight:700;color:var(--ink)}
  .det .cad{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 10px}
  .det a{font-weight:700;color:var(--green)}
  .det .mob{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
  .det .mob .chip{margin:0}
  .sub{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-weight:700;color:var(--ink);background:var(--bg-soft);border-top:1px solid var(--line)}
  .grand{margin:22px 0 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--radius);background:var(--ink);color:#fff;font-weight:700}
  details.fold{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow-sm)}
  details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:44px;font-family:var(--serif);font-weight:700;font-size:19px;color:var(--ink)}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold[open]>summary .chev{transform:rotate(90deg)}
  details.fold>.body{padding:0 16px 10px 40px}
  details.fold li{margin-bottom:8px}
  @media(min-width:760px){
    :root{--cols:20px minmax(0,1fr) 44px 84px 92px 84px 84px}
    .cols{display:grid}
    .cell{display:block}
    .det .mob{display:none}
  }
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="part-list"></script>
<header class="page-head">
  <div class="inner">
    <p class="label">Build</p>
    <h1>Part list</h1>
    <p class="updated" id="updated"></p>
  </div>
</header>
<div id="list"></div>
<footer class="site">Designed in London, being built in São Paulo.</footer>
<script>
const ORDER=['to get','ordered','have'];
const LABEL={'to get':'To buy','ordered':'Ordered','have':'Have'};
const WHERE={'uk-now':'UK arm','uk-carry':'UK carry','brazil':'Brazil'};
const SYM={USD:'$',GBP:'£',BRL:'R$'};
function money(v,c){return (SYM[c]||c+' ')+v.toLocaleString('en-GB',{maximumFractionDigits:2});}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function addTotals(t,i){if(i.status!=='to get'||i.printed||i.unit_price==null)return;t[i.currency]=(t[i.currency]||0)+i.unit_price*(i.qty||1);}
function fmt(t){const p=Object.entries(t).map(([c,v])=>'~'+money(v,c));return p.length?p.join(' + '):'No prices yet';}
function fold(list,title,right,tag,build){
  const sec=el('section','block');const inner=el('div','inner');
  const d=el('details','fold');const sm=el('summary');sm.append(el('span','chev','›'),el('span',null,title));
  if(right){const r=el('span','total',right);r.style.marginLeft='auto';r.style.fontFamily='var(--sans)';r.style.fontSize='14px';sm.appendChild(r);}
  const b=el('div','body');build(b);d.append(sm,b);inner.appendChild(d);sec.appendChild(inner);list.appendChild(sec);
}
function olist(arr){const ol=el('ol');arr.forEach(x=>ol.appendChild(el('li',null,x)));return ol;}
function row(i,g){
  const d=el('details','row'+(i.status==='have'?' done':''));
  const sm=el('summary');const ln=el('div','line');
  const missing=i.printed||i.unit_price==null;
  const unit=missing?'—':(i.approx?'~':'')+money(i.unit_price,i.currency);
  const line=missing?'—':(i.approx?'~':'')+money(i.unit_price*(i.qty||1),i.currency);
  const cls=i.status==='have'?'now':i.status==='ordered'?'next':'later';
  const nm=el('div','nm',i.item);
  const tot=el('div','tot'+(missing?' tbc':''),line);
  const q=el('div','cell q',i.qty!=null?String(i.qty):'–');
  const u=el('div','cell u'+(missing?' tbc':''),unit);
  const w=el('div','cell l w',WHERE[g.id]||i.where);
  const s2=el('div','cell l s');s2.appendChild(el('span','chip '+cls,LABEL[i.status]));
  ln.append(el('span','chev','›'),nm,q,u,tot,w,s2);
  sm.appendChild(ln);
  d.appendChild(sm);
  const det=el('div','det');
  const mob=el('p','mob');mob.append(el('span',null,(i.qty?i.qty+' ×':'–')+(missing?'':' '+unit)),el('span','chip '+cls,LABEL[i.status]),el('span','chip where',WHERE[g.id]||i.where));det.appendChild(mob);
  let note=i.note||'',cad='';
  const k=note.search(/DIMENSIONS:|CAD mismatch/);
  if(k>=0){cad=note.slice(k).replace(/^DIMENSIONS:\s*/,'');note=note.slice(0,k).trim();}
  if(note){const p=el('p');p.append(el('span','k','Details: '),document.createTextNode(note));det.appendChild(p);}
  det.appendChild(Object.assign(el('p'),{innerHTML:''})).append(el('span','k','For: '),document.createTextNode(i.for+(i.eta?' · arriving '+i.eta:'')));
  if(i.weight_g!=null){const p=el('p');p.append(el('span','k','Weight: '),document.createTextNode('about '+i.weight_g+' g'+(i.qty>1?' in total':'')));det.appendChild(p);}
  if(cad){const p=el('p','cad');p.append(el('span','k','CAD mismatch: '),document.createTextNode(cad));det.appendChild(p);}
  const lp=el('p');
  if(i.link){const a=el('a',null,i.link_label||'Buy here →');a.href=i.link;a.target='_blank';a.rel='noopener';lp.appendChild(a);}
  else lp.appendChild(el('span','note','No link yet'));
  det.appendChild(lp);d.appendChild(det);return d;
}
fetch('part-list.json').then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent='Last updated '+d.updated;
  const list=document.getElementById('list');
  if(d.before_ordering)fold(list,'Before ordering',null,0,b=>b.appendChild(olist(d.before_ordering)));
  const grand={};let grandUnpriced=0;
  d.groups.forEach(g=>{
    const items=d.items.filter(i=>i.group===g.id).sort((a,b)=>ORDER.indexOf(a.status)-ORDER.indexOf(b.status));
    if(!items.length)return;
    const totals={};let unpriced=0;
    items.forEach(i=>{addTotals(totals,i);addTotals(grand,i);if(i.status==='to get'&&!i.printed&&i.unit_price==null){unpriced++;grandUnpriced++;}});
    const sec=el('section','block');const inner=el('div','inner wide');
    const head=el('div','sechead');head.appendChild(el('h2',null,g.title));
    const t=el('div','total',fmt(totals));
    if(unpriced)t.appendChild(el('small',null,' + '+unpriced+' without a price'));
    head.appendChild(t);inner.appendChild(head);
    inner.appendChild(el('p','note',g.blurb));
    if(g.carry_note){
      const dd=el('details','fold');dd.style.marginBottom='12px';
      const sm=el('summary');sm.style.fontSize='15px';sm.style.fontFamily='var(--sans)';sm.append(el('span','chev','›'),el('span',null,'Carry weight and cabin bag notes'));
      const b=el('div','body');b.appendChild(el('p','note',g.carry_note));dd.append(sm,b);inner.appendChild(dd);
    }
    const tbl=el('div','tbl');
    const cols=el('div','cols');['','Item','Qty','Unit','Total','Buy','Status'].forEach(x=>cols.appendChild(el('span',null,x)));
    cols.children[2].style.textAlign=cols.children[3].style.textAlign=cols.children[4].style.textAlign='right';
    tbl.appendChild(cols);
    items.forEach(i=>tbl.appendChild(row(i,g)));
    const sub=el('div','sub');sub.append(el('span',null,'Subtotal'),el('span',null,fmt(totals)));
    tbl.appendChild(sub);inner.appendChild(tbl);sec.appendChild(inner);list.appendChild(sec);
  });
  const gs=el('section','block');const gi=el('div','inner');
  const gt=el('div','grand');gt.append(el('span',null,'Grand total (still to buy)'),el('span',null,fmt(grand)+(grandUnpriced?' + '+grandUnpriced+' without a price':'')));
  gi.appendChild(gt);gi.appendChild(el('p','note','Pounds and reais are not added together, and items marked Have or Ordered are left out.')).style.marginTop='8px';
  gs.appendChild(gi);list.appendChild(gs);
  if(d.wiring){
    const cart=d.items.filter(i=>/^Cart/.test(i.for)&&i.unit_price!=null&&i.currency==='GBP'&&i.group==='uk-carry');
    const ct=cart.reduce((a,i)=>a+i.unit_price*(i.qty||1),0);
    fold(list,d.wiring.title,'Cart parts from UK: ~'+money(ct,'GBP'),0,b=>b.appendChild(olist(d.wiring.steps)));
  }
  if(d.power)fold(list,d.power.title,null,0,b=>b.appendChild(olist(d.power.steps)));
});
</script>
</body>
</html>
