<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — History</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="preload" as="fetch" href="history.json" crossorigin>
<style>
  .entry{position:relative;border-left:2px solid #cfe9da;padding:0 0 26px 20px;margin-left:6px;overflow-wrap:anywhere}
  .entry:before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--green-bright)}
  .entry .date{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--green)}
  .entry h2{font-size:21px;margin:4px 0 8px}
  .entry ul{margin:0;padding-left:18px;font-size:15px;line-height:1.55}
  .entry li{margin:3px 0}
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="history"></script>
<header class="page-head">
  <div class="inner">
    <p class="label">Record</p>
    <h1>History</h1>
    <p class="updated" id="updated"></p>
  </div>
</header>
<section class="block"><div class="inner" id="list"></div></section>
<footer class="site">Designed in London, being built in São Paulo.</footer>
<script>
fetch('history.json').then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent='Last updated '+d.updated;
  const list=document.getElementById('list');
  d.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{
    const el=document.createElement('div');el.className='entry';
    el.innerHTML='<div class="date"></div><h2></h2><ul></ul>';
    el.querySelector('.date').textContent=new Date(e.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    el.querySelector('h2').textContent=e.title;
    const ul=el.querySelector('ul');
    e.items.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
    list.appendChild(el);
  });
});
</script>
</body>
</html>
