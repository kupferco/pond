<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — History</title>
<style>
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;max-width:100%}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f7f4;color:#1d2a1f}
  .wrap{max-width:800px;margin:auto;padding:20px 16px}
  nav{display:flex;flex-wrap:wrap;gap:6px 14px}
  nav a{color:#2f6b3a;text-decoration:none;font-weight:600}
  h1{margin:8px 0 4px}.updated{color:#667;font-size:14px}
  .entry{border-left:3px solid #2f6b3a;padding:0 0 18px 16px;margin-left:6px;position:relative;overflow-wrap:anywhere}
  .entry:before{content:"";position:absolute;left:-8px;top:4px;width:13px;height:13px;border-radius:50%;background:#2f6b3a}
  .date{font-size:13px;color:#667}
  .entry h3{margin:2px 0 6px;font-size:17px}
  .entry ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:#334}
  #list{margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="../">Home</a><a href="../gallery/">Drawings</a><a href="../roadmap/">Roadmap</a><a href="../decisions/">Decisions</a><a href="../shopping/">Shopping</a><a href="./">History</a></nav>
  <h1>History</h1>
  <div class="updated" id="updated"></div>
  <div id="list"></div>
</div>
<script>
fetch('history.json').then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent='Last updated '+d.updated;
  const list=document.getElementById('list');
  d.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{
    const el=document.createElement('div');el.className='entry';
    el.innerHTML='<div class="date"></div><h3></h3><ul></ul>';
    el.querySelector('.date').textContent=new Date(e.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    el.querySelector('h3').textContent=e.title;
    const ul=el.querySelector('ul');
    e.items.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
    list.appendChild(el);
  });
});
</script>
</body>
</html>
