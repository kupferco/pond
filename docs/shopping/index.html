<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — Shopping list</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f7f4;color:#1d2a1f}
  .wrap{max-width:1100px;margin:auto;padding:24px 20px}
  nav a{margin-right:14px;color:#2f6b3a;text-decoration:none;font-weight:600}
  h1{margin:8px 0 4px}.updated{color:#667;font-size:14px}
  h2{font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin:24px 0 10px;color:#2f6b3a}
  .card{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;gap:12px;align-items:flex-start}
  .card.bought{opacity:.5}.card.bought h3{text-decoration:line-through}
  .tick{font-size:20px;line-height:1}
  .card h3{margin:0 0 4px;font-size:16px}
  .meta{font-size:14px;color:#334}
  .chip{display:inline-block;font-size:12px;background:#e3efe5;color:#2f6b3a;border-radius:20px;padding:2px 8px;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="../">Home</a><a href="../gallery/">Drawings</a><a href="../roadmap/">Roadmap</a><a href="./">Shopping</a><a href="../history/">History</a></nav>
  <h1>Shopping list</h1>
  <div class="updated" id="updated"></div>
  <div id="list"></div>
</div>
<script>
fetch('shopping.json').then(r=>r.json()).then(d=>{
  document.getElementById('updated').textContent='Last updated '+d.updated;
  const list=document.getElementById('list');
  ['UK','Brazil'].forEach(w=>{
    const items=d.items.filter(i=>i.where===w).sort((a,b)=>a.bought-b.bought);
    if(!items.length)return;
    const h=document.createElement('h2');h.textContent='Buy in '+w;list.appendChild(h);
    items.forEach(i=>{
      const c=document.createElement('div');c.className='card'+(i.bought?' bought':'');
      c.innerHTML='<div class="tick"></div><div><h3></h3><div class="meta"></div></div>';
      c.querySelector('.tick').textContent=i.bought?'✅':'⬜';
      c.querySelector('h3').textContent=(i.qty?i.qty+' × ':'')+i.item;
      const m=c.querySelector('.meta');
      [i.for,i.price||'price tbc'].forEach(t=>{const s=document.createElement('span');s.className='chip';s.textContent=t;m.appendChild(s);});
      if(i.note){const p=document.createElement('div');p.textContent=i.note;m.appendChild(p);}
      list.appendChild(c);
    });
  });
});
</script>
</body>
</html>
