<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pond — Photos</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,45%),1fr));gap:8px}
  .pgrid button{padding:0;border:0;background:var(--bg-soft);border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1;-webkit-tap-highlight-color:transparent}
  .pgrid img{display:block;width:100%;height:100%;object-fit:cover}
  #lb{position:fixed;inset:0;z-index:1000;background:#111;color:#eee;display:none;flex-direction:column;font:14px/1.4 system-ui,sans-serif;touch-action:pan-y}
  #lb.open{display:flex}
  #lb .bar{display:flex;gap:10px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 10px)}
  #lb .bar strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  #lb button{color:#eee;font:600 15px system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);cursor:pointer}
  #lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  #lb .stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  #lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;padding:0;font-size:22px}
  #lb .prev{left:calc(env(safe-area-inset-left) + 6px)}#lb .next{right:calc(env(safe-area-inset-right) + 6px)}
  #lb .cap{padding:8px 16px calc(env(safe-area-inset-bottom) + 14px);text-align:center;min-height:20px}
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="photos"></script>
<header class="page-head">
  <div class="inner wide">
    <p class="label">Earlier builds</p>
    <h1>Photos</h1>
    <p class="updated" id="updated"></p>
  </div>
</header>
<main class="block"><div class="inner wide"><div class="pgrid" id="grid">Loading…</div></div></main>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="bar"><button id="back" type="button" aria-label="Back to the photos">&#8592; Back</button><strong id="ttl"></strong><span id="cnt"></span></div>
  <div class="stage"><img id="big" alt=""><button class="nav prev" type="button" aria-label="Previous photo">&#8249;</button><button class="nav next" type="button" aria-label="Next photo">&#8250;</button></div>
  <div class="cap" id="cap"></div>
</div>
<footer class="site" id="foot"></footer>
<script>
// Photos are copied from the Drive folder "Pond photos" into Cloud Storage by control-ui/scripts/sync-photos.mjs.
const BUCKET='pond-grow.firebasestorage.app';
const url=p=>'https://firebasestorage.googleapis.com/v0/b/'+BUCKET+'/o/'+encodeURIComponent(p)+'?alt=media';
let list=[],cur=-1;
const $=id=>document.getElementById(id);
function fmt(t){const d=new Date(t);return isNaN(d)?'':d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}
function show(i){
  if(i<0||i>=list.length)return;
  cur=i;const p=list[i];
  $('big').src=url('photos/web/'+p.id+'.jpg');$('big').alt=p.caption||p.name;
  $('ttl').textContent=p.name;$('cnt').textContent=(i+1)+' / '+list.length;
  $('cap').textContent=[fmt(p.taken),p.caption].filter(Boolean).join(' · ');
}
// Opening pushes a history entry, so the phone's back gesture and the Back button do the same thing.
function open(i){
  if(cur<0)history.pushState({lb:1},'');
  $('lb').classList.add('open');document.body.style.overflow='hidden';show(i);
}
function hide(){cur=-1;$('lb').classList.remove('open');document.body.style.overflow='';$('big').removeAttribute('src');}
function close(){if(cur<0)return;if(history.state&&history.state.lb)history.back();else hide();}
addEventListener('popstate',()=>{if(cur>=0)hide();});
$('back').onclick=close;
document.querySelector('.prev').onclick=()=>show(cur-1);
document.querySelector('.next').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{if(cur<0)return;if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(cur-1);else if(e.key==='ArrowRight')show(cur+1);});
let sx=null,sy=0;
$('lb').addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}else sx=null;},{passive:true});
$('lb').addEventListener('touchend',e=>{
  if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)show(cur+(dx<0?1:-1));
},{passive:true});
fetch(url('photos/index.json'),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{
  list=d.photos||[];const g=$('grid');g.textContent='';
  if(!list.length){g.textContent='No photos yet. Add some to the "Pond photos" folder in Drive and run the photo sync.';return;}
  list.forEach((p,i)=>{
    const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',p.name);
    const im=document.createElement('img');im.loading='lazy';im.src=url('photos/thumb/'+p.id+'.jpg');im.alt=p.caption||p.name;
    b.appendChild(im);b.onclick=()=>open(i);g.appendChild(b);
  });
  $('updated').textContent=list.length+' photos, newest first.';
  $('foot').textContent='Synced '+fmt(d.updated)+' from the Drive folder "Pond photos"';
}).catch(()=>{$('grid').textContent='Could not load the photos.';});
</script>
</body>
</html>
