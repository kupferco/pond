<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — 3D viewer</title>
<style>
  html,body{margin:0;height:100%;background:#1d1f24;color:#eee;font:14px system-ui,sans-serif}
  model-viewer{width:100%;height:100%;background:#1d1f24;--poster-color:#1d1f24}
  #t{position:fixed;top:10px;left:12px;z-index:2;text-shadow:0 1px 3px #000}
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body>
<div id="t"></div>
<model-viewer id="m" camera-controls auto-rotate shadow-intensity="1" exposure="1" touch-action="pan-y" interaction-prompt="none"></model-viewer>
<script>
// Same viewer as the render server's /viewer page, for GLBs that live in this gallery (renders/*.glb only).
const q=new URLSearchParams(location.search),src=q.get('src')||'';
if(/^renders\/[\w.-]+\.glb$/.test(src)){const m=document.getElementById('m');m.src=src;m.alt=q.get('title')||'model';}
else document.getElementById('m').remove();
document.getElementById('t').textContent=(q.get('title')||'').slice(0,120);
</script>
</body>
</html>
