<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pond — Gallery</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,45%),1fr));gap:8px}
  .pgrid button{padding:0;border:0;background:var(--bg-soft);border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1;-webkit-tap-highlight-color:transparent}
  .pgrid img{display:block;width:100%;height:100%;object-fit:cover}
  #lb{position:fixed;inset:0;z-index:1000;background:#111;color:#eee;display:none;flex-direction:column;font:14px/1.4 system-ui,sans-serif;touch-action:pan-y}
  #lb.open{display:flex}
  #lb .bar{display:flex;gap:10px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 10px)}
  #lb .bar strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  #lb button{color:#eee;font:600 15px system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);cursor:pointer}
  #lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  .pcat{margin:24px 0 10px;font-size:1.2rem}.pcat:first-child{margin-top:0}
  .pgrid .play{position:relative}.pgrid .play::after{content:'\25B6';position:absolute;right:6px;bottom:6px;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px}
  #lb .stage video{max-width:100%;max-height:100%;background:#000}
  #lb .stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  #lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;padding:0;font-size:22px}
  #lb .prev{left:calc(env(safe-area-inset-left) + 6px)}#lb .next{right:calc(env(safe-area-inset-right) + 6px)}
  #lb .cap{padding:8px 16px calc(env(safe-area-inset-bottom) + 14px);text-align:center;min-height:20px}
</style>
</head>
<body>
<script>if(/^#cat=/.test(location.hash))location.replace("../drawings/"+location.hash);</script>
<script src="../assets/site.js" data-root="../" data-page="gallery"></script>
<header class="page-head">
  <div class="inner wide">
    <p class="label">Images and videos documenting Pond</p>
    <h1>Gallery</h1>
    <p class="updated" id="updated"></p>
  </div>
</header>
<main class="block"><div class="inner wide"><div id="grid">Loading…</div></div></main>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="bar"><button id="back" type="button" aria-label="Back to the gallery">&#8592; Back</button><strong id="ttl"></strong><span id="cnt"></span></div>
  <div class="stage"><img id="big" alt=""><video id="vid" controls muted playsinline preload="metadata" hidden></video><button class="nav prev" type="button" aria-label="Previous photo">&#8249;</button><button class="nav next" type="button" aria-label="Next photo">&#8250;</button></div>
  <div class="cap" id="cap"></div>
</div>
<footer class="site" id="foot"></footer>
<script>
// Photos are copied from a Drive folder (Online Gallery) into Cloud Storage by control-ui/scripts/sync-photos.mjs.
const BUCKET='pond-grow.firebasestorage.app';
const url=p=>'https://firebasestorage.googleapis.com/v0/b/'+BUCKET+'/o/'+encodeURIComponent(p)+'?alt=media';
let list=[],cur=-1;
const $=id=>document.getElementById(id);
function fmt(t){const d=new Date(t);return isNaN(d)?'':d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}
function stopVid(){const v=$('vid');v.pause();v.removeAttribute('src');v.removeAttribute('poster');v.load();}
function show(i){
  if(i<0||i>=list.length)return;
  cur=i;const p=list[i];
  const v=p.type==='video';
  $('big').hidden=v;$('vid').hidden=!v;
  if(v){$('big').removeAttribute('src');$('vid').muted=true;$('vid').poster=url('photos/thumb/'+p.id+'.jpg');$('vid').src=url('photos/video/'+p.id+'.mp4');}
  else{stopVid();$('big').src=url('photos/web/'+p.id+'.jpg');$('big').alt=p.caption||p.name;}
  $('ttl').textContent=p.name;$('cnt').textContent=(i+1)+' / '+list.length;
  $('cap').textContent=[fmt(p.taken),p.caption].filter(Boolean).join(' · ');
}
// Opening pushes a history entry, so the phone's back gesture and the Back button do the same thing.
function open(i){
  if(cur<0)history.pushState({lb:1},'');
  $('lb').classList.add('open');document.body.style.overflow='hidden';show(i);
}
function hide(){cur=-1;$('lb').classList.remove('open');document.body.style.overflow='';$('big').removeAttribute('src');stopVid();}
function close(){if(cur<0)return;if(history.state&&history.state.lb)history.back();else hide();}
addEventListener('popstate',()=>{if(cur>=0)hide();});
$('back').onclick=close;
document.querySelector('.prev').onclick=()=>show(cur-1);
document.querySelector('.next').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{if(cur<0)return;if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(cur-1);else if(e.key==='ArrowRight')show(cur+1);});
let sx=null,sy=0;
$('lb').addEventListener('touchstart',e=>{if(e.touches.length===1&&!e.target.closest('video')){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}else sx=null;},{passive:true});
$('lb').addEventListener('touchend',e=>{
  if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)show(cur+(dx<0?1:-1));
},{passive:true});
fetch(url('photos/index.json'),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{
  const all=d.photos||[];const g=$('grid');g.textContent='';
  if(!all.length){g.textContent='Nothing here yet. Add photos or videos to the Online Gallery folder in Drive and run the photo sync.';return;}
  // One section per category, in the order the sync wrote (alphabetical, "Other" last); the viewer steps through them in that order.
  const cats=(d.categories||[]).slice();all.forEach(p=>{if(!cats.includes(p.category))cats.push(p.category||'Other');});
  list=[];
  cats.forEach(c=>{
    const items=all.filter(p=>(p.category||'Other')===c);if(!items.length)return;
    const h=document.createElement('h2');h.className='pcat';h.textContent=c;g.appendChild(h);
    const grid=document.createElement('div');grid.className='pgrid';g.appendChild(grid);
    items.forEach(p=>{
      const i=list.push(p)-1;
      const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',(p.type==='video'?'Video: ':'')+p.name);
      if(p.type==='video')b.className='play';
      const im=document.createElement('img');im.loading='lazy';im.src=url('photos/thumb/'+p.id+'.jpg');im.alt=p.caption||p.name;
      b.appendChild(im);b.onclick=()=>open(i);grid.appendChild(b);
    });
  });
  $('updated').textContent=all.length+' photos and videos in '+$('grid').querySelectorAll('.pcat').length+' categories, newest first within each.';
  $('foot').textContent='Synced '+fmt(d.updated)+' from Drive';
}).catch(()=>{$('grid').textContent='Could not load the gallery.';});
</script>
</body>
</html>
