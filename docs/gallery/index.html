<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — Drawings</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  #filters{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:16px 22px 4px;scrollbar-width:none}
  #filters::-webkit-scrollbar{display:none}
  #filters button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 14px var(--sans);box-shadow:var(--shadow-sm);cursor:pointer}
  #filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:16px}
  .dcard{background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;overflow-wrap:anywhere}
  .dcard a.view{display:block;text-decoration:none;color:inherit}
  .dcard img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--bg-soft)}
  .dcard .noimg{width:100%;aspect-ratio:4/3;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .dcard .body{padding:14px 16px 16px}
  .dcard .date{font-size:13px;color:var(--muted);margin:2px 0 6px}
  .dcard .comment{font-size:14px;line-height:1.5}
  .s-sketch{background:#eef1f5;color:#555}.s-draft{background:var(--amber-soft);color:var(--amber)}
  .s-tested{background:#dcecff;color:#0b4f86}.s-final{background:#d9f2e3;color:var(--green)}
  .s-experiment{background:#f0e1ff;color:#5d2a85}.s-superseded{background:#f8dddd;color:#8a2b2b}
  .hist-btn{margin-top:12px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:600 13px var(--sans);color:var(--ink);cursor:pointer}
  .hist{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .hist.open{display:block}
  .hist a{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13px;color:var(--body);text-decoration:none}
  .hist img{width:52px;height:40px;object-fit:contain;background:var(--bg-soft);border-radius:6px;flex:none}
  .gal h2{margin-top:8px}
</style>
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="gallery"></script>
<header class="page-head">
  <div class="inner wide">
    <p class="label">CAD</p>
    <h1>Drawings</h1>
    <p class="updated">One card per part, showing its latest version. Tap a drawing to open it in 3D.</p>
  </div>
</header>
<nav id="filters" aria-label="Filter by category"></nav>
<main class="block gal"><div class="inner wide" id="gallery">Loading…</div></main>
<footer class="site" id="foot"></footer>
<script>
const CATEGORIES=["Cart","Arm","Unit structure","Pod handling","Water","Power","Flat-pack and transport","Experiments"];
let DATA=null,active="All";
function chip(text,cls){const s=document.createElement('span');s.className='chip '+cls;s.textContent=text;return s;}
function viewerUrl(r){
  // GLB files in this repo open in our own small 3D viewer page; server links open as they are.
  return /\.glb$/i.test(r.viewer)?'viewer.html?src='+encodeURIComponent(r.viewer)+'&title='+encodeURIComponent(r.title):r.viewer;
}
function thumbEl(r){
  if(r.thumb){const i=document.createElement('img');i.src=r.thumb;i.alt=r.title;i.loading='lazy';return i;}
  const d=document.createElement('div');d.className='noimg';d.textContent='Open in viewer';return d;
}
function parts(){
  const by={};
  DATA.renders.forEach(r=>{const k=r.part||r.title;(by[k]=by[k]||[]).push(r);});
  Object.values(by).forEach(l=>l.sort((a,b)=>(b.version||0)-(a.version||0)||(b.date>a.date?1:-1)));
  return by;
}
function card(list){
  const r=list[0];
  const el=document.createElement('div');el.className='dcard';
  const a=document.createElement('a');a.className='view';a.href=viewerUrl(r);a.target='_blank';a.rel='noopener';
  a.appendChild(thumbEl(r));
  const body=document.createElement('div');body.className='body';
  const chips=document.createElement('div');
  const st=(r.status||'draft').toLowerCase();
  chips.append(chip(st+(r.version?' · v'+r.version:''),'s-'+st));
  if(active==='All')chips.append(chip(r.category||'Other',''));
  const t=document.createElement('h3');t.textContent=r.part||r.title;
  const d=document.createElement('div');d.className='date';d.textContent=r.date;
  const c=document.createElement('div');c.className='comment';c.textContent=r.comment;
  body.append(chips,t,d,c);a.appendChild(body);el.appendChild(a);
  if(list.length>1){
    const box=document.createElement('div');box.className='body';box.style.paddingTop='0';
    const btn=document.createElement('button');btn.className='hist-btn';btn.textContent='History ('+(list.length-1)+' older)';
    const hist=document.createElement('div');hist.className='hist';
    list.slice(1).forEach(o=>{
      const h=document.createElement('a');h.href=viewerUrl(o);h.target='_blank';h.rel='noopener';
      h.append(thumbEl(o));
      const s=document.createElement('span');s.textContent=(o.version?'v'+o.version+' — ':'')+o.title+' ('+o.date+')';
      h.append(s);hist.appendChild(h);
    });
    btn.onclick=()=>hist.classList.toggle('open');
    box.append(btn,hist);el.appendChild(box);
  }
  return el;
}
function render(){
  const main=document.getElementById('gallery');main.innerHTML='';
  const by=parts();
  const cats=active==='All'?CATEGORIES.concat(['Other']):[active];
  cats.forEach(cat=>{
    const lists=Object.values(by).filter(l=>(l[0].category||'Other')===cat);
    if(!lists.length)return;
    lists.sort((a,b)=>(b[0].date>a[0].date?1:-1));
    const h=document.createElement('h2');h.textContent=cat;main.appendChild(h);
    const grid=document.createElement('div');grid.className='grid';grid.style.marginBottom='28px';
    lists.forEach(l=>grid.appendChild(card(l)));
    main.appendChild(grid);
  });
  if(!main.children.length)main.textContent='Nothing in this category yet.';
}
function filters(){
  const nav=document.getElementById('filters');nav.innerHTML='';
  ['All'].concat(CATEGORIES).forEach(c=>{
    const b=document.createElement('button');b.textContent=c;if(c===active)b.className='on';
    b.onclick=()=>{active=c;filters();render();};
    nav.appendChild(b);
  });
}
fetch('renders.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
  DATA=data;filters();render();
  document.getElementById('foot').textContent='List updated '+data.updated+' · source: docs/gallery/renders.json';
}).catch(()=>{document.getElementById('gallery').textContent='Could not load renders.json.';});
</script>
</body>
</html>
