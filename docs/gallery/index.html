<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — CAD gallery</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f5f1; color: #222; }
  header { padding: 24px 32px; background: #1f3b2d; color: #fff; }
  header h1 { margin: 0 0 4px; font-size: 26px; }
  header p { margin: 0; opacity: .8; }
  main { padding: 16px 32px 48px; }
  h2 { margin: 32px 0 12px; font-size: 18px; border-bottom: 1px solid #ccc; padding-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); text-decoration: none; color: inherit; display: flex; flex-direction: column; }
  .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: contain; background: #fafafa; }
  .card .body { padding: 10px 12px 14px; }
  .card .title { font-weight: 600; font-size: 15px; }
  .card .date { font-size: 12px; color: #777; margin: 2px 0 6px; }
  .card .comment { font-size: 13px; color: #444; }
  footer { padding: 16px 32px; font-size: 12px; color: #777; }
</style>
</head>
<body>
<header>
  <h1>Pond — CAD gallery</h1>
  <p>Open-source communal urban farming unit. Click any drawing to open it in the 3D viewer.</p>
</header>
<main id="gallery">Loading…</main>
<footer id="foot"></footer>
<script>
fetch('renders.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(data => {
    const main = document.getElementById('gallery');
    main.innerHTML = '';
    const groups = {};
    data.renders.forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
    Object.keys(groups).forEach(g => {
      const h = document.createElement('h2'); h.textContent = g; main.appendChild(h);
      const grid = document.createElement('div'); grid.className = 'grid';
      groups[g].forEach(r => {
        const a = document.createElement('a');
        a.className = 'card'; a.href = r.viewer; a.target = '_blank'; a.rel = 'noopener';
        const img = document.createElement('img'); img.src = r.thumb; img.alt = r.title; img.loading = 'lazy';
        const body = document.createElement('div'); body.className = 'body';
        const t = document.createElement('div'); t.className = 'title'; t.textContent = r.title;
        const d = document.createElement('div'); d.className = 'date'; d.textContent = r.date;
        const c = document.createElement('div'); c.className = 'comment'; c.textContent = r.comment;
        body.append(t, d, c); a.append(img, body); grid.appendChild(a);
      });
      main.appendChild(grid);
    });
    document.getElementById('foot').textContent = 'List updated ' + data.updated + ' · source: docs/gallery/renders.json in kupferco/pond';
  })
  .catch(() => { document.getElementById('gallery').textContent = 'Could not load renders.json.'; });
</script>
</body>
</html>
