<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pond — Decisions and notes</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<script src="../assets/site.js" data-root="../" data-page="decisions"></script>
<div id="view"></div>
<footer class="site">Designed in London, being built in São Paulo.</footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
let D=null;
const view=document.getElementById('view');
function list(){
  view.innerHTML='<header class="page-head"><div class="inner"><p class="label">Why</p><h1>Decisions and notes</h1></div></header>';
  [['decisions','Decisions'],['notes','Working notes']].forEach(([k,label])=>{
    const sec=document.createElement('section');sec.className='block';
    sec.innerHTML='<div class="inner"><h2></h2><div class="rows"></div></div>';
    sec.querySelector('h2').textContent=label;
    const rows=sec.querySelector('.rows');
    D[k].forEach(d=>{
      const a=document.createElement('a');a.className='row';a.href='#'+encodeURIComponent(d.file);
      const dv=document.createElement('div');dv.textContent=d.title;
      const s=document.createElement('small');s.textContent=new Date(d.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      dv.appendChild(s);a.appendChild(dv);rows.appendChild(a);
    });
    view.appendChild(sec);
  });
  window.scrollTo(0,0);
}
function show(file){
  view.innerHTML='<section class="block"><div class="inner"><a class="back" href="#">← All decisions and notes</a><article class="prose" id="doc">Loading…</article></div></section>';
  fetch(file).then(r=>r.text()).then(t=>{
    const doc=document.getElementById('doc');
    doc.innerHTML=marked.parse(t);
    doc.querySelectorAll('table').forEach(tb=>{const w=document.createElement('div');w.className='tbl';tb.parentNode.insertBefore(w,tb);w.appendChild(tb);});
    window.scrollTo(0,0);
  }).catch(()=>{document.getElementById('doc').textContent='Could not load '+file;});
}
function route(){const h=decodeURIComponent(location.hash.slice(1));h?show(h):list();}
fetch('docs.json').then(r=>r.json()).then(d=>{D=d;route();window.onhashchange=route;});
</script>
</body>
</html>
